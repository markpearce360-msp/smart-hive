<script>

const supabaseUrl = "https://wqbkbjogeptvuuvcmefz.supabase.co";

const supabaseKey = "sb_publishable_CL56nK5r-Ku5U2dXQbl5Kw_p19Bilbz";


async function getHiveData() {

    try {

        const response = await fetch(
            supabaseUrl +
            "/rest/v1/hive_readings?Hive_id=eq." + document.getElementById("hiveSelect").value + "&order=ID.desc&limit=1",
        
            
            
            {
                headers: {
                    "apikey": supabaseKey,
                    "Authorization": "Bearer " + supabaseKey
                }
            }
        );

        if (!response.ok) {
            throw new Error("Supabase returned " + response.status);
        }

        const data = await response.json();

        if (data.length > 0) {

            const hive = data[0];

            document.getElementById("hiveName").textContent =
            document.getElementById("hiveSelect").value;

            document.getElementById("weight").textContent =
                Number(hive.Weight).toFixed(1) + " g";

            document.getElementById("temperature").textContent =
                Number(hive.Temperature).toFixed(1) + " °C";

            document.getElementById("humidity").textContent =
                Number(hive.Humidity).toFixed(1) + " %";

            document.getElementById("status").textContent =
                "🟢 HIVE NORMAL";

        } else {

            document.getElementById("weight").textContent = "No data";
            document.getElementById("temperature").textContent = "No data";
            document.getElementById("humidity").textContent = "No data";
            document.getElementById("status").textContent = "⚠️ NO DATA";

        }

    } catch (error) {

        console.log(error);

        document.getElementById("weight").textContent = "Error";
        document.getElementById("temperature").textContent = "Error";
        document.getElementById("humidity").textContent = "Error";
        document.getElementById("status").textContent = "🔴 CONNECTION ERROR";

    }
}


getHiveData();
getWeightHistory();

document.getElementById("hiveSelect").addEventListener("change", function() {
    document.getElementById("hiveName").textContent =
        this.value;

    getHiveData();
    getWeightHistory();
});

let weightChart;

async function getWeightHistory() {

    const hiveID = document.getElementById("hiveSelect").value;

    try {

        const response = await fetch(
            supabaseUrl +
            "/rest/v1/hive_readings?Hive_id=eq." +
            hiveID +
            "&order=ID.desc&limit=200",
            {
                headers: {
                    "apikey": supabaseKey,
                    "Authorization": "Bearer " + supabaseKey
                }
            }
        );

        const data = await response.json();

        data.reverse();

        const labels = data.map(row => row.ID);
        const weights = data.map(row => Number(row.Weight));

        const ctx = document.getElementById("weightChart");

        if (weightChart) {
            weightChart.destroy();
        }

        weightChart = new Chart(ctx, {
            type: "line",

            data: {
                labels: labels,

                datasets: [{
                    label: "Weight (g)",
                    data: weights,
                    tension: 0.2
                }]
            },

            options: {
                responsive: true,

                scales: {
                    x: {
                        title: {
                            display: true,
                            text: "Reading"
                        }
                    },

                    y: {
                        title: {
                            display: true,
                            text: "Weight (g)"
                        }
                    }
                }
            }
        });

    } catch (error) {

        console.log("Graph error:", error);

    }
}


</script>
