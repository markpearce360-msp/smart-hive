<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Hive</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.controls {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.controls label {
    font-weight: bold;
    margin-right: 10px;
}

select {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

button {
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    background: #ddd;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #ccc;
}

button.active {
    background: #333;
    color: white;
}

/* Sensor buttons */

.sensor-weight.active {
    background: #1976d2;
}

.sensor-temperature.active {
    background: #e53935;
}

.sensor-humidity.active {
    background: #00897b;
}

.sensor-all.active {
    background: #6a1b9a;
}

/* Cards */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

/* Alarm */

.alarm {
    background: #eeeeee;
}

.alarm.active {
    background: #ff3333;
    color: white;
}

.reset-button {
    background: #d32f2f;
    color: white;
    font-size: 16px;
    padding: 12px 20px;
    margin-top: 10px;
}

.reset-button:hover {
    background: #b71c1c;
}

/* Graph */

.chart-container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    height: 500px;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

.last-reading {
    font-size: 14px;
    color: #666;
}

</style>
</head>

<body>

<div class="container">

<h1>🐝 SMART HIVE</h1>

<!-- Hive selector -->

<div class="controls">

    <label for="hiveSelect">Hive:</label>

    <select id="hiveSelect" onchange="changeHive()">

        <option value="Hive001">Hive001</option>
        <option value="Hive002">Hive002</option>
        <option value="Hive003">Hive003</option>
        <option value="Hive004">Hive004</option>
        <option value="Hive005">Hive005</option>
        <option value="Hive006">Hive006</option>
        <option value="Hive007">Hive007</option>
        <option value="Hive008">Hive008</option>
        <option value="Hive009">Hive009</option>
        <option value="Hive010">Hive010</option>
        <option value="Hive011">Hive011</option>
        <option value="Hive012">Hive012</option>
        <option value="Hive013">Hive013</option>
        <option value="Hive014">Hive014</option>
        <option value="Hive015">Hive015</option>
        <option value="Hive016">Hive016</option>
        <option value="Hive017">Hive017</option>
        <option value="Hive018">Hive018</option>
        <option value="Hive019">Hive019</option>
        <option value="Hive020">Hive020</option>
        <option value="Hive021">Hive021</option>
        <option value="Hive022">Hive022</option>
        <option value="Hive023">Hive023</option>
        <option value="Hive024">Hive024</option>
        <option value="Hive025">Hive025</option>

    </select>


    <!-- Sensor selection -->

    <div class="button-row">

        <button
            class="sensor-weight active"
            onclick="changeSensor('weight', this)">
            ⚖️ Weight
        </button>

        <button
            class="sensor-temperature"
            onclick="changeSensor('temperature', this)">
            🌡️ Temperature
        </button>

        <button
            class="sensor-humidity"
            onclick="changeSensor('humidity', this)">
            💧 Humidity
        </button>

        <button
            class="sensor-all"
            onclick="changeSensor('all', this)">
            📊 All Sensors
        </button>

    </div>


    <!-- Time selection -->

    <div class="button-row">

        <button class="time-button active"
                onclick="changeChartPeriod('minutes', this)">
            Minutes
        </button>

        <button class="time-button"
                onclick="changeChartPeriod('hourly', this)">
            Hourly
        </button>

        <button class="time-button"
                onclick="changeChartPeriod('daily', this)">
            Daily
        </button>

        <button class="time-button"
                onclick="changeChartPeriod('30days', this)">
            30 Days
        </button>

    </div>

</div>


<!-- Sensor cards -->

<div class="cards">

    <div class="card">
        <h2>⚖️ Weight</h2>
        <div class="value" id="weight">--</div>
        <div>grams</div>
    </div>

    <div class="card">
        <h2>🌡️ Temperature</h2>
        <div class="value" id="temperature">--</div>
        <div>°C</div>
    </div>

    <div class="card">
        <h2>💧 Humidity</h2>
        <div class="value" id="humidity">--</div>
        <div>%</div>
    </div>

    <div class="card">
        <h2>📡 Status</h2>
        <div class="value" id="status">--</div>
    </div>

    <div class="card">
        <h2>🕒 Last Reading</h2>
        <div class="last-reading" id="lastReading">--</div>
    </div>

    <div class="card alarm" id="alarmCard">

        <h2>🚨 Alarm</h2>

        <div class="value" id="alarmStatus">
            NORMAL
        </div>

        <button
            class="reset-button"
            id="resetButton"
            onclick="resetAlarm()"
            style="display:none;">
            RESET ALARM
        </button>

    </div>

</div>


<!-- Graph -->

<div class="chart-container">

    <canvas id="weightChart"></canvas>

</div>


</div>


<script>

/* ============================
   SUPABASE
============================ */

const SUPABASE_URL =
"https://wqbkbjogeptvuuvcmefz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CL56nK5r-Ku5U2dXQbl5Kw_p19Bilbz";


/* ============================
   VARIABLES
============================ */

let currentHive = "Hive001";

let currentSensor = "weight";

let currentChartPeriod = "minutes";

let chart = null;


/* ============================
   CHANGE HIVE
============================ */

function changeHive() {

    currentHive =
        document.getElementById("hiveSelect").value;

    loadLatestReading();

    loadAlarm();

    loadWeightHistory();
}


/* ============================
   CHANGE SENSOR
============================ */

function changeSensor(sensor, button) {

    currentSensor = sensor;

    document
        .querySelectorAll(".sensor-weight, .sensor-temperature, .sensor-humidity, .sensor-all")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    loadWeightHistory();
}


/* ============================
   CHANGE TIME
============================ */

function changeChartPeriod(period, button) {

    currentChartPeriod = period;

    document
        .querySelectorAll(".time-button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    loadWeightHistory();
}


/* ============================
   SUPABASE HEADERS
============================ */

function getHeaders() {

    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
    };

}


/* ============================
   LOAD LATEST READING
============================ */

async function loadLatestReading() {

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/hive_readings" +
            "?Hive_id=eq." +
            encodeURIComponent(currentHive) +
            "&order=ID.desc" +
            "&limit=1";

        const response =
            await fetch(url, {
                headers: getHeaders()
            });

        const data =
            await response.json();

        if (!data || data.length === 0) {

            document.getElementById("weight").textContent = "--";
            document.getElementById("temperature").textContent = "--";
            document.getElementById("humidity").textContent = "--";
            document.getElementById("status").textContent = "NO DATA";
            document.getElementById("lastReading").textContent = "--";

            return;
        }

        const reading = data[0];

        document.getElementById("weight").textContent =
            Number(reading.Weight).toFixed(1);

        document.getElementById("temperature").textContent =
            Number(reading.Temperature).toFixed(1);

        document.getElementById("humidity").textContent =
            Number(reading.Humidity).toFixed(0);


        document.getElementById("status").textContent =
            "ONLINE";


        if (reading.created_at) {

            const date =
                new Date(reading.created_at);

            document.getElementById("lastReading").textContent =
                date.toLocaleString("en-GB");

        }

    }

    catch (error) {

        console.error(
            "Latest reading error:",
            error
        );

        document.getElementById("status").textContent =
            "ERROR";

    }

}


/* ============================
   LOAD ALARM
============================ */

async function loadAlarm() {

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/hive_control" +
            "?hive_id=eq." +
            encodeURIComponent(currentHive) +
            "&select=alarm";

        const response =
            await fetch(url, {
                headers: getHeaders()
            });

        const data =
            await response.json();

        if (!data || data.length === 0) {

            return;
        }

        updateAlarmDisplay(
            data[0].alarm
        );

    }

    catch (error) {

        console.error(
            "Alarm error:",
            error
        );

    }

}


/* ============================
   UPDATE ALARM DISPLAY
============================ */

function updateAlarmDisplay(alarm) {

    const alarmCard =
        document.getElementById("alarmCard");

    const alarmStatus =
        document.getElementById("alarmStatus");

    const resetButton =
        document.getElementById("resetButton");


    if (alarm === true) {

        alarmCard.classList.add("active");

        alarmStatus.textContent =
            "WEIGHT LOSS ALARM";

        resetButton.style.display =
            "inline-block";

    }

    else {

        alarmCard.classList.remove("active");

        alarmStatus.textContent =
            "NORMAL";

        resetButton.style.display =
            "none";

    }

}


/* ============================
   RESET ALARM
============================ */

async function resetAlarm() {

    const resetButton =
        document.getElementById("resetButton");

    resetButton.disabled = true;

    resetButton.textContent =
        "RESETTING...";


    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/hive_control" +
            "?hive_id=eq." +
            encodeURIComponent(currentHive);


        const response =
            await fetch(url, {

                method: "PATCH",

                headers: {
                    ...getHeaders(),
                    "Content-Type":
                        "application/json",
                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify({
                    reset_alarm: true
                })

            });


        console.log(
            "Reset command sent:",
            response.status
        );


        /*
           Now we wait for the ESP8266
           to see the command and clear
           the alarm.
        */

        let attempts = 0;

        const checkReset =
            setInterval(async () => {

                attempts++;

                try {

                    const checkURL =
                        SUPABASE_URL +
                        "/rest/v1/hive_control" +
                        "?hive_id=eq." +
                        encodeURIComponent(currentHive) +
                        "&select=alarm,reset_alarm";


                    const checkResponse =
                        await fetch(checkURL, {
                            headers: getHeaders()
                        });


                    const checkData =
                        await checkResponse.json();


                    console.log(
                        "Reset check:",
                        checkData
                    );


                    if (
                        checkData.length > 0 &&
                        checkData[0].alarm === false &&
                        checkData[0].reset_alarm === false
                    ) {

                        clearInterval(checkReset);

                        updateAlarmDisplay(false);

                        resetButton.disabled =
                            false;

                        resetButton.textContent =
                            "RESET ALARM";

                        return;

                    }


                    /*
                       Stop checking after
                       30 seconds.
                    */

                    if (attempts >= 15) {

                        clearInterval(checkReset);

                        resetButton.disabled =
                            false;

                        resetButton.textContent =
                            "RESET ALARM";

                        alert(
                            "The ESP8266 has not reset the alarm yet. Please check the hive controller."
                        );

                    }

                }

                catch (error) {

                    console.error(
                        "Reset checking error:",
                        error
                    );

                }

            }, 2000);

    }

    catch (error) {

        console.error(
            "Reset error:",
            error
        );

        resetButton.disabled =
            false;

        resetButton.textContent =
            "RESET ALARM";

    }

}


/* ============================
   LOAD GRAPH DATA
============================ */

async function loadWeightHistory() {

    try {

        let limit = 60;

        if (currentChartPeriod === "hourly") {

            limit = 288;

        }

        else if (currentChartPeriod === "daily") {

            limit = 2016;

        }

        else if (currentChartPeriod === "30days") {

            limit = 8640;

        }


        const url =
            SUPABASE_URL +
            "/rest/v1/hive_readings" +
            "?Hive_id=eq." +
            encodeURIComponent(currentHive) +
            "&select=created_at,Weight,Temperature,Humidity" +
            "&order=created_at.desc" +
            "&limit=" +
            limit;


        const response =
            await fetch(url, {
                headers: getHeaders()
            });


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            console.error(
                "Graph data error:",
                data
            );

            return;
        }


        /*
           Supabase gives newest first.
           Reverse it so the graph goes
           oldest -> newest.
        */

        data.reverse();


        drawChart(data);

    }

    catch (error) {

        console.error(
            "Graph error:",
            error
        );

    }

}


/* ============================
   DRAW GRAPH
============================ */

function drawChart(data) {

    const ctx =
        document
            .getElementById("weightChart")
            .getContext("2d");


    if (chart) {

        chart.destroy();

    }


    /*
       Build labels
    */

    const labels =
        data.map(reading => {

            const date =
                new Date(reading.created_at);


            if (currentChartPeriod === "minutes") {

                return date.toLocaleTimeString(
                    "en-GB",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            }


            if (currentChartPeriod === "hourly") {

                return date.toLocaleString(
                    "en-GB",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        hour: "2-digit"
                    }
                );

            }


            return date.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "2-digit"
                }
            );

        });


    const datasets = [];


    /* ============================
       WEIGHT
    ============================ */

    if (
        currentSensor === "weight" ||
        currentSensor === "all"
    ) {

        datasets.push({

            label: "Weight (g)",

            data:
                data.map(r =>
                    Number(r.Weight)
                ),

            borderColor: "#1976d2",

            backgroundColor:
                "rgba(25,118,210,0.1)",

            borderWidth: 2,

            pointRadius: 2,

            tension: 0.25,

            yAxisID: "y"

        });

    }


    /* ============================
       TEMPERATURE
    ============================ */

    if (
        currentSensor === "temperature" ||
        currentSensor === "all"
    ) {

        datasets.push({

            label: "Temperature (°C)",

            data:
                data.map(r =>
                    Number(r.Temperature)
                ),

            borderColor: "#e53935",

            backgroundColor:
                "rgba(229,57,53,0.1)",

            borderWidth: 2,

            pointRadius: 2,

            tension: 0.25,

            yAxisID:
                currentSensor === "all"
                    ? "y1"
                    : "y"

        });

    }


    /* ============================
       HUMIDITY
    ============================ */

    if (
        currentSensor === "humidity" ||
        currentSensor === "all"
    ) {

        datasets.push({

            label: "Humidity (%)",

            data:
                data.map(r =>
                    Number(r.Humidity)
                ),

            borderColor: "#00897b",

            backgroundColor:
                "rgba(0,137,123,0.1)",

            borderWidth: 2,

            pointRadius: 2,

            tension: 0.25,

            yAxisID:
                currentSensor === "all"
                    ? "y2"
                    : "y"

        });

    }


    /* ============================
       GRAPH SCALES
    ============================ */

    const scales = {

        x: {

            title: {

                display: true,

                text: "Time"

            }

        }

    };


    /*
       ALL SENSOR MODE
    */

    if (currentSensor === "all") {

        scales.y = {

            type: "linear",

            position: "left",

            title: {

                display: true,

                text: "Weight (g)"

            },

            ticks: {

                callback: function(value) {

                    return value + " g";

                }

            }

        };


        scales.y1 = {

            type: "linear",

            position: "right",

            title: {

                display: true,

                text: "Temperature (°C)"

            },

            grid: {

                drawOnChartArea: false

            },

            ticks: {

                callback: function(value) {

                    return value + " °C";

                }

            }

        };


        scales.y2 = {

            type: "linear",

            position: "right",

            offset: true,

            title: {

                display: true,

                text: "Humidity (%)"

            },

            grid: {

                drawOnChartArea: false

            },

            ticks: {

                callback: function(value) {

                    return value + "%";

                }

            }

        };

    }


    /*
       SINGLE SENSOR MODE
    */

    else {

        let title = "";

        if (currentSensor === "weight") {

            title = "Weight (g)";

        }

        else if (currentSensor === "temperature") {

            title = "Temperature (°C)";

        }

        else if (currentSensor === "humidity") {

            title = "Humidity (%)";

        }


        scales.y = {

            type: "linear",

            position: "left",

            title: {

                display: true,

                text: title

            }

        };

    }


    /* ============================
       CREATE CHART
    ============================ */

    chart = new Chart(ctx, {

        type: "line",

        data: {

            labels: labels,

            datasets: datasets

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            interaction: {

                mode: "index",

                intersect: false

            },

            plugins: {

                legend: {

                    display: true,

                    position: "top"

                }

            },

            scales: scales

        }

    });

}


/* ============================
   INITIAL LOAD
============================ */

loadLatestReading();

loadAlarm();

loadWeightHistory();


/* ============================
   AUTO REFRESH
============================ */

setInterval(() => {

    loadLatestReading();

    loadAlarm();

    loadWeightHistory();

}, 30000);

</script>

</body>
</html>
